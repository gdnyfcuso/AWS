<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地图测试 - OpenStreetMap</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; padding: 20px; background: #f5f5f5; }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { margin-bottom: 10px; color: #333; }
    .subtitle { color: #666; margin-bottom: 20px; }
    #status { background: white; padding: 12px 16px; margin-bottom: 15px; border-radius: 8px; border-left: 4px solid #3b82f6; }
    .success { border-left-color: #22c55e; }
    .error { border-left-color: #ef4444; }
    #map { width: 100%; height: 450px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; z-index: 1; }
    #cities { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; margin-bottom: 15px; }
    .city-btn { padding: 12px 8px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; transition: transform 0.2s; }
    .city-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4); }
    #info { background: white; padding: 16px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    #infoText { background: #f9fafb; padding: 12px; border-radius: 6px; font-family: monospace; font-size: 13px; white-space: pre-wrap; }
    .loading { display: inline-block; width: 16px; height: 16px; border: 2px solid #f3f3f3; border-top: 2px solid #3498db; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 8px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <div class="container">
    <h1>🗺️ 中国地图 - 地区切换</h1>
    <p class="subtitle">点击城市按钮切换地图位置</p>

    <div id="status">
      <span class="loading"></span>正在初始化地图...
    </div>

    <div id="map"></div>

    <div id="cities"></div>

    <div id="info">
      <h3 style="margin-bottom: 10px;">📍 当前位置</h3>
      <div id="infoText">请选择一个城市...</div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const API_BASE = 'http://100.64.0.131:3000/api/v1';
    let map = null;
    let currentMarker = null;

    // 更新状态
    function setStatus(message, type = 'info') {
      const statusDiv = document.getElementById('status');
      const className = type === 'success' ? 'success' : type === 'error' ? 'error' : '';
      statusDiv.className = className;
      statusDiv.innerHTML = message;
      console.log(`[${type.toUpperCase()}] ${message.replace(/<[^>]*>/g, '')}`);
    }

    // 初始化地图
    function initMap() {
      try {
        setStatus('<span class="loading"></span>正在创建地图...');

        // 创建地图，使用中国中心
        map = L.map('map', {
          center: [35.8617, 104.1954],
          zoom: 4,
          zoomControl: true
        });

        // 使用 OpenStreetMap 作为主要图层（更可靠）
        const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap contributors',
          maxZoom: 19
        });

        // 尝试添加天地图作为可选图层
        const tiandituLayer = L.tileLayer('https://t0.tianditu.gov.cn/DataServer?T=vec_w&x={x}&y={y}&l={z}', {
          attribution: '&copy; 天地图',
          maxZoom: 18
        });

        // 添加图层控制器
        const baseLayers = {
          "OpenStreetMap": osmLayer,
          "天地图": tiandituLayer
        };

        osmLayer.addTo(map);

        L.control.layers(baseLayers).addTo(map);

        setStatus('✅ 地图初始化成功！', 'success');
        return true;
      } catch (error) {
        setStatus('❌ 地图初始化失败: ' + error.message, 'error');
        console.error('地图初始化错误:', error);
        return false;
      }
    }

    // 加载城市按钮
    async function loadCities() {
      try {
        setStatus('<span class="loading"></span>正在加载城市列表...');

        const response = await fetch(`${API_BASE}/map/cities`);
        const data = await response.json();

        if (data.success) {
          const citiesDiv = document.getElementById('cities');
          citiesDiv.innerHTML = data.cities.map(city => `
            <button class="city-btn" onclick="goToCity('${city.id}', '${city.name}')">
              ${city.name.replace('市', '')}
            </button>
          `).join('');

          setStatus(`✅ 已加载 ${data.cities.length} 个城市，请点击按钮切换`, 'success');
        } else {
          setStatus('❌ 加载城市失败', 'error');
        }
      } catch (error) {
        setStatus('❌ API连接失败: ' + error.message, 'error');
        console.error('加载城市错误:', error);
      }
    }

    // 前往城市
    async function goToCity(cityId, cityName) {
      try {
        setStatus(`<span class="loading"></span>正在前往 ${cityName}...`);

        const response = await fetch(`${API_BASE}/map/view?region_id=${cityId}`);
        const data = await response.json();

        if (data.success && data.view) {
          const { center, zoom } = data.view;

          // 移动地图
          map.flyTo([center.lat, center.lng], zoom, {
            duration: 1.5
          });

          // 移除旧标记
          if (currentMarker) {
            map.removeLayer(currentMarker);
          }

          // 添加新标记
          currentMarker = L.marker([center.lat, center.lng]).addTo(map);
          currentMarker.bindPopup(`
            <div style="min-width: 120px;">
              <b style="font-size: 14px;">${cityName}</b><br>
              <span style="color: #666;">纬度: ${center.lat.toFixed(4)}</span><br>
              <span style="color: #666;">经度: ${center.lng.toFixed(4)}</span>
            </div>
          `).openPopup();

          // 更新信息显示
          document.getElementById('infoText').textContent =
            `城市: ${cityName}\n纬度: ${center.lat.toFixed(4)}°\n经度: ${center.lng.toFixed(4)}°\n缩放级别: ${zoom}`;

          setStatus(`✅ 已到达 ${cityName}`, 'success');
        } else {
          setStatus('❌ 获取地图视图失败', 'error');
        }
      } catch (error) {
        setStatus('❌ 切换城市失败: ' + error.message, 'error');
        console.error('切换城市错误:', error);
      }
    }

    // 页面加载完成后执行
    window.addEventListener('load', () => {
      console.log('页面加载完成');

      // 短暂延迟后初始化
      setTimeout(() => {
        if (initMap()) {
          // 延迟加载城市列表
          setTimeout(() => {
            loadCities();
          }, 500);
        }
      }, 100);
    });
  </script>
</body>
</html>
