<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中国地图 - 多源地图</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; padding: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
    .container { max-width: 1400px; margin: 0 auto; }
    .header { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    h1 { color: #333; margin-bottom: 5px; }
    .subtitle { color: #666; font-size: 14px; }
    .main-content { display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
    .map-container { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .sidebar { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-height: 600px; overflow-y: auto; }
    #status { padding: 12px; margin-bottom: 15px; border-radius: 8px; font-size: 14px; }
    .status-info { background: #e3f2fd; color: #1976d2; }
    .status-success { background: #e8f5e9; color: #388e3c; }
    .status-error { background: #ffebee; color: #d32f2f; }
    #map { width: 100%; height: 500px; border-radius: 8px; border: 2px solid #e0e0e0; }
    .city-section { margin-bottom: 20px; }
    .city-section h3 { font-size: 16px; margin-bottom: 10px; color: #333; }
    #cities { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .city-btn { padding: 10px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
    .city-btn:hover { transform: scale(1.05); box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4); }
    .city-btn:active { transform: scale(0.95); }
    #info { background: #f5f5f5; padding: 12px; border-radius: 8px; font-size: 13px; }
    .layer-control { margin-top: 15px; }
    .layer-btn { padding: 8px 12px; margin-right: 5px; margin-bottom: 5px; border: 2px solid #667eea; background: white; border-radius: 6px; cursor: pointer; font-size: 12px; transition: all 0.2s; }
    .layer-btn.active { background: #667eea; color: white; }
    .layer-btn:hover { border-color: #764ba2; }
    @media (max-width: 900px) {
      .main-content { grid-template-columns: 1fr; }
    }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🗺️ 中国地图 - 地区切换系统</h1>
      <p class="subtitle">支持国家 → 城市 → 区县 → 村庄/地标 四级导航</p>
    </div>

    <div class="main-content">
      <div class="map-container">
        <div id="status" class="status-info">
          <span id="statusText">⏳ 正在初始化...</span>
        </div>
        <div id="map"></div>
        <div class="layer-control">
          <span style="font-size: 13px; color: #666;">切换图层：</span>
          <button class="layer-btn active" onclick="switchLayer('osm')">OpenStreetMap</button>
          <button class="layer-btn" onclick="switchLayer('tdt')">天地图</button>
          <button class="layer-btn" onclick="switchLayer('geoq')">GeoQ</button>
        </div>
      </div>

      <div class="sidebar">
        <div class="city-section">
          <h3>🏙️ 主要城市</h3>
          <div id="cities">
            <button class="city-btn" onclick="goToCity('beijing', '北京')">北京</button>
            <button class="city-btn" onclick="goToCity('shanghai', '上海')">上海</button>
            <button class="city-btn" onclick="goToCity('guangzhou', '广州')">广州</button>
            <button class="city-btn" onclick="goToCity('shenzhen', '深圳')">深圳</button>
            <button class="city-btn" onclick="goToCity('hangzhou', '杭州')">杭州</button>
            <button class="city-btn" onclick="goToCity('chengdu', '成都')">成都</button>
            <button class="city-btn" onclick="goToCity('xian', '西安')">西安</button>
            <button class="city-btn" onclick="goToCity('china', '中国全图')">中国全图</button>
          </div>
        </div>

        <div class="city-section">
          <h3>📍 当前位置</h3>
          <div id="info">请选择一个城市...</div>
        </div>

        <div class="city-section">
          <h3>🏘️ 子地区</h3>
          <div id="children" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;">
            <span style="color: #999; font-size: 12px;">选择城市后显示子地区</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const API_BASE = 'http://100.64.0.131:3000/api/v1';
    let map = null;
    let currentMarker = null;
    let layers = {};

    // 状态更新
    function setStatus(message, type = 'info') {
      const statusDiv = document.getElementById('status');
      const statusText = document.getElementById('statusText');
      statusDiv.className = 'status-' + type;
      statusText.textContent = message;
    }

    // 初始化地图
    function initMap() {
      try {
        setStatus('⏳ 正在创建地图...', 'info');

        map = L.map('map', {
          center: [35.8617, 104.1954],
          zoom: 4,
          zoomControl: true
        });

        // OpenStreetMap
        layers.osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '© OpenStreetMap'
        }).addTo(map);

        // 天地图 - 使用正确的URL格式
        layers.tdt_vec = L.tileLayer('https://t{s}.tianditu.gov.cn/DataServer?T=vec_w&x={x}&y={y}&l={z}&tk=YOUR_KEY', {
          subdomains: ['0', '1', '2', '3', '4', '5', '6', '7'],
          maxZoom: 18,
          attribution: '© 天地图'
        });

        layers.tdt_cva = L.tileLayer('https://t{s}.tianditu.gov.cn/DataServer?T=cva_w&x={x}&y={y}&l={z}&tk=YOUR_KEY', {
          subdomains: ['0', '1', '2', '3', '4', '5', '6', '7'],
          maxZoom: 18,
          attribution: '© 天地图'
        });

        // GeoQ (智图)
        layers.geoq = L.tileLayer('https://map.geoq.cn/ArcGIS/rest/services/ChinaOnlineCommunity/MapServer/tile/{z}/{y}/{x}', {
          maxZoom: 18,
          attribution: '© GeoQ'
        });

        setStatus('✅ 地图初始化成功！', 'success');
        return true;
      } catch (error) {
        setStatus('❌ 地图初始化失败: ' + error.message, 'error');
        return false;
      }
    }

    // 切换图层
    function switchLayer(layerType) {
      try {
        // 移除所有图层
        Object.values(layers).forEach(layer => {
          if (layer && map.hasLayer(layer)) {
            map.removeLayer(layer);
          }
        });

        // 添加选中的图层
        if (layerType === 'osm') {
          layers.osm.addTo(map);
        } else if (layerType === 'tdt') {
          layers.tdt_vec.addTo(map);
          layers.tdt_cva.addTo(map);
        } else if (layerType === 'geoq') {
          layers.geoq.addTo(map);
        }

        // 更新按钮状态
        document.querySelectorAll('.layer-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        setStatus(`✅ 已切换到${event.target.textContent}`, 'success');
      } catch (error) {
        setStatus('❌ 切换图层失败', 'error');
      }
    }

    // 加载城市
    async function loadCities() {
      try {
        const response = await fetch(`${API_BASE}/map/cities`);
        const data = await response.json();
        if (data.success) {
          console.log('已加载', data.cities.length, '个城市');
        }
      } catch (error) {
        console.error('加载城市失败:', error);
      }
    }

    // 前往城市
    async function goToCity(cityId, cityName) {
      try {
        setStatus(`⏳ 正在前往 ${cityName}...`, 'info');

        const response = await fetch(`${API_BASE}/map/view?region_id=${cityId}`);
        const data = await response.json();

        if (data.success && data.view) {
          const { center, zoom } = data.view;

          map.flyTo([center.lat, center.lng], zoom, { duration: 1.5 });

          if (currentMarker) map.removeLayer(currentMarker);
          currentMarker = L.marker([center.lat, center.lng]).addTo(map)
            .bindPopup(`<b>${cityName}</b><br>纬度: ${center.lat.toFixed(4)}<br>经度: ${center.lng.toFixed(4)}`)
            .openPopup();

          document.getElementById('info').innerHTML =
            `<b>${cityName}</b><br>纬度: ${center.lat.toFixed(4)}°<br>经度: ${center.lng.toFixed(4)}°<br>缩放: ${zoom}`;

          setStatus(`✅ 已到达 ${cityName}`, 'success');

          // 加载子地区
          loadChildren(cityId);
        }
      } catch (error) {
        setStatus('❌ 切换失败: ' + error.message, 'error');
      }
    }

    // 加载子地区
    async function loadChildren(parentId) {
      try {
        const response = await fetch(`${API_BASE}/map/regions/${parentId}/children`);
        const data = await response.json();

        const childrenDiv = document.getElementById('children');
        if (data.success && data.children.length > 0) {
          childrenDiv.innerHTML = data.children.map(child => `
            <button class="city-btn" onclick="goToCity('${child.id}', '${child.name}')">
              ${child.name}
            </button>
          `).join('');
        } else {
          childrenDiv.innerHTML = '<span style="color: #999; font-size: 12px;">没有子地区</span>';
        }
      } catch (error) {
        console.error('加载子地区失败:', error);
      }
    }

    // 页面加载
    window.addEventListener('load', () => {
      setTimeout(() => {
        if (initMap()) {
          loadCities();
        }
      }, 100);
    });
  </script>
</body>
</html>
