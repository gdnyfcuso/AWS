<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地图API测试</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-2xl font-bold mb-6">🗺️ 地图API测试</h1>

    <div class="bg-white rounded-lg shadow p-6 mb-6">
      <h2 class="text-lg font-semibold mb-4">测试API端点</h2>
      <div class="space-y-3">
        <button onclick="testCities()" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">测试城市列表</button>
        <button onclick="testBeijingChildren()" class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600">测试北京的区县</button>
        <button onclick="testChaoyangChildren()" class="px-4 py-2 bg-purple-500 text-white rounded hover:bg-purple-600">测试朝阳区的地标</button>
        <button onclick="testSearch()" class="px-4 py-2 bg-orange-500 text-white rounded hover:bg-orange-600">测试搜索(中关村)</button>
      </div>
    </div>

    <div class="bg-white rounded-lg shadow p-6">
      <h2 class="text-lg font-semibold mb-4">响应结果</h2>
      <pre id="result" class="bg-gray-100 p-4 rounded overflow-auto max-h-96 text-sm">点击按钮测试API...</pre>
    </div>
  </div>

  <script>
    const API_BASE = 'http://100.64.0.131:3000/api/v1';

    function showResult(data) {
      document.getElementById('result').textContent = JSON.stringify(data, null, 2);
    }

    async function testCities() {
      try {
        const res = await fetch(`${API_BASE}/map/cities`);
        const data = await res.json();
        showResult(data);
      } catch (error) {
        showResult({ error: error.message });
      }
    }

    async function testBeijingChildren() {
      try {
        const res = await fetch(`${API_BASE}/map/regions/beijing/children`);
        const data = await res.json();
        showResult(data);
      } catch (error) {
        showResult({ error: error.message });
      }
    }

    async function testChaoyangChildren() {
      try {
        const res = await fetch(`${API_BASE}/map/regions/chaoyang/children`);
        const data = await res.json();
        showResult(data);
      } catch (error) {
        showResult({ error: error.message });
      }
    }

    async function testSearch() {
      try {
        const res = await fetch(`${API_BASE}/map/search?q=中关村`);
        const data = await res.json();
        showResult(data);
      } catch (error) {
        showResult({ error: error.message });
      }
    }
  </script>
</body>
</html>
